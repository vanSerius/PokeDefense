<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1c2c">
<title>PokeDefense – Pokémon Tower Defense</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="assets/sprites/static/25.png">
</head>
<body>
<div id="rotate-overlay">
  <div class="rotate-icon">📱↻</div>
  <div>Bitte drehe dein Gerät<br>ins Querformat!</div>
</div>

<div id="app" class="hidden">
  <div id="topbar">
    <div class="tb-group">
      <span class="tb-item" id="tb-hearts"><i class="ico ico-heart"></i><span>20</span></span>
      <span class="tb-item" id="tb-gold"><i class="ico ico-coin"></i><span>0</span></span>
    </div>
    <div class="tb-group">
      <span class="tb-item" id="tb-map">Map 1/12</span>
      <span class="tb-item" id="tb-wave">Welle 0/6</span>
    </div>
    <div class="tb-group">
      <button class="tb-btn" id="btn-wave">Start</button>
      <button class="tb-btn" id="btn-speed">1&times;</button>
      <button class="tb-btn" id="btn-pause">II</button>
      <button class="tb-btn" id="btn-mute"><i class="ico ico-sound-on" style="margin:0"></i></button>
    </div>
  </div>
  <div id="stage">
    <canvas id="game"></canvas>
    <button id="skillbtn" class="hidden"><span class="sk-icon"></span><span class="sk-name"></span></button>
  </div>
  <div id="buildbar">
    <div id="towerbar"></div>
    <div id="towerpanel" class="hidden"></div>
  </div>
</div>

<div id="screens"></div>

<div id="loading">
  <div class="load-ball"></div>
  <div id="load-text">Lade Pokémon…</div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
